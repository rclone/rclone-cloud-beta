name: docker

# Builds the image of an rclone Cloud release and publishes it to this repository's registry,
# ghcr.io/rclone/rclone-cloud-beta, for linux/amd64 and linux/arm64.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The release's tag, such as v0.0.0-20261105. Leave empty for the newest release.
        required: false
        default: ''

permissions: {}

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release's Linux binaries, checked against its checksums.txt and unpacked as
      # <arch>/rclone-cloud. Only the newest release is also tagged latest.
      - name: Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES: rclone/rclone-cloud
          ASKED: ${{ inputs.release }}
        run: |
          set -euo pipefail
          newest="$(gh release list -R "$RELEASES" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          tag="${ASKED:-$newest}"
          gh release download "$tag" -R "$RELEASES" -D release -p checksums.txt -p "rclone-cloud-$tag-linux-*.tar.gz"
          (cd release && sha256sum --check --ignore-missing checksums.txt)
          for arch in amd64 arm64; do
            mkdir -p "context/$arch"
            tar -xzf "release/rclone-cloud-$tag-linux-$arch.tar.gz" -C "context/$arch" \
              --strip-components=1 "rclone-cloud-$tag-linux-$arch/rclone-cloud"
          done
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${tag#v}"
          if [ "$tag" = "$newest" ]; then tags+=",$image:latest"; fi
          echo "building $tag as ${tags//,/ }"
          {
            echo "version=${tag#v}"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The source label links the package to this repository, whose visibility it can then take.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.title=rclone Cloud
            org.opencontainers.image.description=A platform for rclone power-users.
